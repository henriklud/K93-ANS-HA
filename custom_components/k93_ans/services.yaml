send_notification:
  name: Send notification
  description: >-
    Sends a notification through K93 ANS. It is fanned out to configured
    recipients and channels according to their filters, and optionally
    created as a persistent notification requiring acknowledgement.
  fields:
    title:
      name: Title
      description: Notification title.
      required: true
      example: "Front door opened"
      selector:
        text:
    message:
      name: Message
      description: Notification message body.
      required: true
      example: "Front door sensor triggered while armed away"
      selector:
        text:
    icon:
      name: Icon
      description: >-
        An mdi: icon shown as the notification's small icon/glyph. If it's
        not an mdi: icon (and "image" is not set), it's used as the picture
        instead, for backward compatibility - prefer the separate "image"
        field for pictures going forward.
      required: false
      example: "mdi:door-open"
      selector:
        text:
    image:
      name: Image
      description: >-
        A picture to attach to the notification: an image URL, or an
        HA-relative path such as /local/... or /api/camera_proxy/.... Shown
        as the picture on companion-app push notifications, embedded in the
        message (as markdown) when "persistent" is true, and shown as a
        preview in the Lovelace card.
      required: false
      example: "/local/vacuum_map.jpg"
      selector:
        text:
    image_entity:
      name: Image entity
      description: >-
        A camera or image entity to snapshot for the picture instead of
        supplying "image" directly. Saved under
        /config/www/K93-Advanced-Notification-System/<channel>/, uniquely
        named per capture, and served back as an "image" path automatically.
        Ignored if "image" is also given - an explicit "image" always wins.
        Old captures are cleaned up automatically once no stored notification
        references them anymore (see the integration README).
      required: false
      example: "camera.front_door"
      selector:
        entity:
          filter:
            - domain: camera
            - domain: image
    channel:
      name: Channel
      description: >-
        Configured channel key, or a list of them. Built-in channels are
        info, alert, event, reminder, security and system. When several are
        given, a recipient receives the notification if it's subscribed to
        any one of them; the first channel is used for anything that can
        only carry one value (Android's notification channel, the card's
        icon color). Defaults to "default".
      required: false
      example: '["security", "event"]'
      selector:
        text:
          multiple: true
    importance:
      name: Importance
      description: Importance level.
      required: false
      default: "normal"
      selector:
        select:
          options:
            - "low"
            - "normal"
            - "high"
            - "critical"
    actions:
      name: Actions
      description: List of action buttons, each with "action" and "title" keys.
      required: false
      example: '[{"action": "OPEN_CAMERA", "title": "View Camera"}]'
    persistent:
      name: Persistent
      description: >-
        If true, requires acknowledgement via the built-in persistent
        notification system.
      required: false
      default: false
      selector:
        boolean:
    data:
      name: Data
      description: Arbitrary extra fields passed through to notify.* targets.
      required: false
    target_recipients:
      name: Target recipients
      description: >-
        Restrict delivery to these recipients only, given by their
        configured name (as shown in Manage Recipients) or their id.
        Case-insensitive. Omit to consider all recipients.
      required: false
      example: '["Henriks phone"]'
      selector:
        text:
          multiple: true
    home_only:
      name: Home only
      description: >-
        Only deliver to recipients whose assigned person entity is currently
        "home". Recipients with no person assigned are unaffected and always
        considered.
      required: false
      default: false
      selector:
        boolean:
    live_id:
      name: Live ID
      description: >-
        A stable id you choose (e.g. "vacuum_kitchen"). Calling
        send_notification again with the same live_id updates that same
        notification in place - same persistent notification, same phone
        push (via a shared tag), same history row - instead of creating a
        new one each time. Useful for a repeatedly-updated status
        notification (e.g. live vacuum-cleaning stats/map). Call
        end_live_notification with the same live_id when the live session
        is over to dismiss and clear it everywhere.
      required: false
      example: "vacuum_kitchen"
      selector:
        text:
    source:
      name: Source
      description: Free-text label for what triggered this notification.
      required: false
      selector:
        text:
    show_in_history:
      name: Show in history
      description: >-
        If false, this notification is excluded from the card's History list
        and ticker, and from the "stored"/"sent" diagnostic sensors. It's
        still delivered, still counted in Unacknowledged while outstanding,
        and can still be acknowledged/ended normally - use this for frequent
        or transient updates (e.g. a live status notification) you don't
        want cluttering history. Defaults to true.
      required: false
      default: true
      selector:
        boolean:
    dismiss_on_action:
      name: Dismiss on action
      description: >-
        If false (default), pressing an action button other than Acknowledge
        (e.g. a vacuum's Pause/Resume) keeps the companion-app notification
        open instead of closing it, by marking it "sticky". Set to true to
        restore the old behavior where any action press dismisses the
        notification. Ignored (always kept open) when "persistent" is true.
      required: false
      default: false
      selector:
        boolean:
    clear_on_acknowledge:
      name: Clear on acknowledge
      description: >-
        If true (default), acknowledging this notification - from the card,
        the k93_ans.acknowledge service, or the phone's own Acknowledge
        button - also clears the pushed notification on every companion-app
        recipient it reached. Set to false to leave the phone notification
        in place even after it's been acknowledged elsewhere.
      required: false
      default: true
      selector:
        boolean:

acknowledge:
  name: Acknowledge
  description: Marks a notification as acknowledged and dismisses its persistent notification, if any.
  fields:
    notification_id:
      name: Notification ID
      description: The id of the notification to acknowledge.
      required: true
      selector:
        text:

end_live_notification:
  name: End live notification
  description: >-
    Ends a live notification started via send_notification's live_id field:
    dismisses its persistent notification (if any), clears the pushed
    notification on every companion-app recipient it reached, and marks it
    acknowledged so it moves out of the Unacknowledged list. A no-op if no
    active live notification exists for that live_id.
  fields:
    live_id:
      name: Live ID
      description: The live_id used in the send_notification calls to update.
      required: true
      example: "vacuum_kitchen"
      selector:
        text:

delete_notification:
  name: Delete notification
  description: >-
    Permanently deletes one notification from history. If it's still
    outstanding (persistent and not yet acknowledged), its persistent
    notification is dismissed and any pushed companion-app notification is
    cleared first, so nothing is left dangling with no history entry behind
    it.
  fields:
    notification_id:
      name: Notification ID
      description: The id of the notification to delete.
      required: true
      selector:
        text:

clear_history:
  name: Clear history
  description: >-
    Deletes multiple notifications from history at once. By default only
    ones that aren't still actively pending acknowledgement are removed
    (the same rule the History section itself uses), so a still-outstanding
    notification is never silently lost - set include_unacknowledged to
    also delete those.
  fields:
    include_unacknowledged:
      name: Include unacknowledged
      description: >-
        If true, also delete notifications that still require
        acknowledgement and haven't gotten it yet.
      required: false
      default: false
      selector:
        boolean:
